<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
:root{--ink:#1d2140}
html,body{height:100%;margin:0}
body{background:#ff9a1f;overflow:hidden;font-family:'Noto Sans KR',sans-serif}
.sunburst{position:fixed;inset:0;background:repeating-conic-gradient(from 0deg at 50% 34%,#ffd23f 0deg 7.5deg,#ff9a1f 7.5deg 15deg);z-index:0}
.sunburst::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 34%,rgba(255,255,255,.55),rgba(255,255,255,0) 40%)}
.floor{position:fixed;left:0;right:0;bottom:0;height:27%;z-index:0;background:linear-gradient(180deg,#2a2f55 0 6%,#ff3f8e 6% 14%,#ffd3e6 14% 16%,#e0177a 16% 100%)}
.floor::after{content:"";position:absolute;inset:16% 0 0 0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.12) 0 14px,rgba(255,255,255,0) 14px 28px),repeating-linear-gradient(-45deg,rgba(0,0,0,.08) 0 14px,rgba(0,0,0,0) 14px 28px)}
.poster{position:fixed;inset:0;width:100%;height:100%;z-index:1}
.poster.port{display:none}
@media (orientation:portrait){.poster.land{display:none}.poster.port{display:block}}
.dizzy-orbit{animation:orbit 4s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes orbit{to{rotate:360deg}}
.ui{position:fixed;inset:0;z-index:2;pointer-events:none}
.bub{position:absolute;pointer-events:auto;font-family:'Jua';font-size:clamp(20px,2.6vw,34px);color:var(--ink);background:#fff;border:4px solid var(--ink);border-radius:999px;padding:10px 26px;box-shadow:0 7px 0 var(--ink)}
.bub::after{content:"";position:absolute;left:34px;bottom:-18px;border:10px solid transparent;border-top:14px solid var(--ink);border-left-width:4px;border-right-width:12px}
.bub::before{content:"";position:absolute;left:38px;bottom:-9px;border:8px solid transparent;border-top:11px solid #fff;border-left-width:3px;border-right-width:10px;z-index:1}
.bub.how{right:19%;bottom:8%}.bub.start{right:3%;bottom:8%}
@media (orientation:portrait){.bub{font-size:clamp(18px,5.4vw,26px);padding:9px 18px}.bub.how{right:auto;left:5%;bottom:7%}.bub.start{right:5%;bottom:7%}}
.credit{position:absolute;left:14px;bottom:10px;font-family:'Jua';color:#fff;font-size:14px;text-shadow:0 2px 0 var(--ink)}
</style></head><body>
<div class="sunburst"></div><div class="floor"></div>
<!--SYMBOLS-->
<svg class="poster land" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
  <use href="#symLogo" x="90" y="22" width="800" height="230"/>
  <use href="#symBadge" x="700" y="234" width="560" height="94"/>
  <use href="#chDocDizzy" x="30" y="316" width="320" height="378"/>
  <use href="#chMR" x="430" y="236" width="410" height="488"/>
  <use href="#chDocYes" x="880" y="310" width="320" height="378"/>
  <use href="#chBear" x="330" y="596" width="104" height="112"/>
  <use href="#chNurse" x="810" y="560" width="100" height="120"/>
  <use href="#symO" x="56" y="196" width="60" height="60"/>
  <use href="#symX" x="1190" y="110" width="54" height="54"/>
  <use href="#symO" x="1120" y="34" width="44" height="44"/>
</svg>
<svg class="poster port" viewBox="0 0 720 1280" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
  <use href="#symLogo" x="8" y="110" width="704" height="204"/>
  <use href="#symBadge" x="150" y="318" width="560" height="94"/>
  <use href="#chDocDizzy" x="-6" y="640" width="290" height="348"/>
  <use href="#chMR" x="190" y="470" width="360" height="428"/>
  <use href="#chDocYes" x="440" y="640" width="290" height="348"/>
  <use href="#chBear" x="40" y="1000" width="100" height="110"/>
  <use href="#chNurse" x="590" y="990" width="96" height="116"/>
  <use href="#symO" x="40" y="40" width="54" height="54"/>
  <use href="#symX" x="630" y="60" width="50" height="50"/>
</svg>
<div class="ui">
  <button class="bub how">게임방법</button><button class="bub start">▶ 게임시작</button>
  <div class="credit">틀린시연찾기 · 웰체크 시연요원 양성소</div>
</div>
</body></html>
